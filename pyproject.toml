[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoos"
version = "1.0.0"
description = "ChronoOS Autonomous Executive Chief of Staff"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0"
]

[tool.vercel]
entrypoint = "backend.api_gateway:app"
